<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot | Doctor Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <style>
        :root {
            --pink-50:  #fff5f9;
            --pink-100: #ffe8f1;
            --pink-200: #ffd0e2;
            --pink-300: #ffadcc;
            --pink-400: #f783ae;
            --pink-500: #e8528f;
            --pink-600: #c93a76;
            --plum:     #4a2040;
            --plum-soft:#8a6380;
        }

        body {
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            color: var(--plum);
            background:
                radial-gradient(circle at 10% 15%, #ffd6e7 0, transparent 38%),
                radial-gradient(circle at 90% 85%, #e9defe 0, transparent 42%),
                radial-gradient(circle at 85% 10%, #ffe9d8 0, transparent 30%),
                #fff7fb;
            background-attachment: fixed;
        }

        .card {
            width: 100%;
            max-width: 420px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #ffffff !important;
            box-shadow: 0 24px 60px rgba(232, 82, 143, 0.22) !important;
            padding: 36px 34px !important;
        }

        .card h2 {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--pink-500) !important;
        }

        .card h2::before {
            content: "\F6E0";
            font-family: "bootstrap-icons";
            display: block;
            width: 62px;
            height: 62px;
            line-height: 62px;
            margin: 0 auto 14px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
            color: #ffffff;
            font-size: 28px;
            font-weight: 400;
            box-shadow: 0 12px 24px rgba(232, 82, 143, 0.35);
        }

        .card .text-muted {
            color: var(--plum-soft) !important;
            font-weight: 500;
        }

        .form-label {
            color: var(--plum);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-control {
            padding: 12px 16px;
            border: 1.5px solid var(--pink-200);
            border-radius: 14px;
            background: var(--pink-50);
            color: var(--plum);
            font-size: 14px;
            transition: 0.2s;
        }

        .form-control::placeholder {
            color: #c7a6ba;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--pink-400);
            box-shadow: 0 0 0 4px rgba(247, 131, 174, 0.22);
            color: var(--plum);
        }

        .btn-primary {
            padding: 13px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
            box-shadow: 0 12px 24px rgba(232, 82, 143, 0.32);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(232, 82, 143, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:focus-visible {
            outline: 3px solid rgba(247, 131, 174, 0.5);
            outline-offset: 2px;
        }

        .card p.text-center {
            color: var(--plum-soft);
            font-size: 14px;
        }

        .card a {
            color: var(--pink-600);
            font-weight: 700;
            text-decoration: none;
        }

        .card a:hover {
            color: var(--pink-500);
            text-decoration: underline;
        }

        /* Flash messages */

        .alert {
            border: none;
            border-left: 5px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-danger {
            background: #ffe9ec;
            color: #c0304a;
            border-left-color: #f2647b;
        }

        .alert-warning {
            background: #fff4e0;
            color: #a06512;
            border-left-color: #f5b041;
        }

        .alert-success {
            background: #e4f8ee;
            color: #1a8f5c;
            border-left-color: #4fcf92;
        }

        .alert-info {
            background: #f1eaff;
            color: #7048c9;
            border-left-color: #a58af0;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px !important;
                border-radius: 22px;
            }
        }
    </style>
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow border-0 p-4" style="width: 420px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">MediSlot</h2>
            <p class="text-muted">Doctor Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control"
                       placeholder="doctor@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">
                Sign In
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
    </div>
</div>

</body>
</html>
