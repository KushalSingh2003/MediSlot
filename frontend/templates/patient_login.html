{% extends "base.html" %}

{% block title %}Patient Login | MediSlot{% endblock %}

{% block styles %}
<style>
    :root {
        --theme-charcoal: #1E1E1C;
        --theme-beige: #D8CBB3;
        --theme-blue: #2F6BFF;
        --theme-muted: rgba(30, 30, 28, 0.68);
        --theme-blue-soft: rgba(47, 107, 255, 0.14);
        --theme-beige-soft: rgba(216, 203, 179, 0.35);
    }

    .patient-login-page {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        min-height: calc(100vh - 7rem);
        padding-top: 2rem;
        padding-bottom: 2rem;
        overflow: hidden;
    }

    .patient-login-page::before,
    .patient-login-page::after {
        position: absolute;
        z-index: -1;
        content: "";
        border-radius: 50%;
        pointer-events: none;
        filter: blur(8px);
    }

    .patient-login-page::before {
        top: 4%;
        left: -8rem;
        width: 21rem;
        height: 21rem;
        background: radial-gradient(circle, var(--theme-blue-soft), transparent 70%);
        animation: driftBlue 13s ease-in-out infinite;
    }

    .patient-login-page::after {
        right: -7rem;
        bottom: 1%;
        width: 23rem;
        height: 23rem;
        background: radial-gradient(circle, var(--theme-beige-soft), transparent 70%);
        animation: driftBeige 16s ease-in-out infinite;
    }

    .patient-login-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(30, 30, 28, 0.12) !important;
        border-radius: 1.5rem !important;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 18px 42px rgba(30, 30, 28, 0.1) !important;
        animation: cardReveal 0.75s cubic-bezier(.22, 1, .36, 1) both;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .patient-login-card::before {
        position: absolute;
        inset: 0 0 auto;
        height: 5px;
        content: "";
        background: linear-gradient(
            90deg,
            var(--theme-charcoal),
            var(--theme-blue),
            var(--theme-beige),
            var(--theme-blue)
        );
        background-size: 250% 100%;
        animation: accentFlow 6s linear infinite;
    }

    .patient-login-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 50px rgba(47, 107, 255, 0.16) !important;
    }

    .patient-login-card h2 {
        color: var(--theme-charcoal);
        font-weight: 700;
        animation: fadeRise 0.6s 0.1s ease both;
    }

    .patient-login-description {
        color: var(--theme-muted) !important;
        animation: fadeRise 0.6s 0.18s ease both;
    }

    .patient-login-card .form-label {
        color: var(--theme-charcoal);
        font-weight: 600;
    }

    .patient-login-card .form-control {
        border: 1px solid rgba(30, 30, 28, 0.18);
        border-radius: 0.75rem;
        padding: 0.75rem 0.9rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .patient-login-card .form-control:hover {
        border-color: var(--theme-beige);
    }

    .patient-login-card .form-control:focus {
        border-color: var(--theme-blue);
        box-shadow: 0 0 0 0.22rem var(--theme-blue-soft);
        transform: translateY(-1px);
    }

    .patient-login-card form .mb-3 {
        animation: fadeRise 0.55s ease both;
    }

    .patient-login-card form .mb-3:nth-child(1) {
        animation-delay: 0.24s;
    }

    .patient-login-card form .mb-3:nth-child(2) {
        animation-delay: 0.34s;
    }

    .patient-login-card .btn-primary {
        border: 0;
        background: linear-gradient(110deg, var(--theme-charcoal), var(--theme-blue)) !important;
        background-size: 200% 100% !important;
        box-shadow: 0 8px 20px rgba(47, 107, 255, 0.22);
        animation: buttonGlow 3s 1s ease-in-out infinite;
        transition: background-position 0.4s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .patient-login-card .btn-primary:hover,
    .patient-login-card .btn-primary:focus-visible {
        background-position: 100% 0 !important;
        transform: translateY(-2px);
        box-shadow: 0 13px 26px rgba(47, 107, 255, 0.3);
    }

    .patient-login-card a:not(.btn) {
        color: var(--theme-blue);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .patient-login-card a:not(.btn):hover {
        color: var(--theme-charcoal);
        text-decoration: underline;
        text-underline-offset: 4px;
    }

    .patient-login-card p a {
        display: inline-block;
    }

    .patient-login-card p.mt-3 {
        animation: fadeRise 0.55s 0.45s ease both;
    }

    .patient-login-card p.mt-2 {
        animation: fadeRise 0.55s 0.55s ease both;
    }

    .patient-login-page a:focus-visible,
    .patient-login-page button:focus-visible {
        outline: 3px solid var(--theme-blue);
        outline-offset: 3px;
    }

    @keyframes cardReveal {
        from {
            opacity: 0;
            transform: translateY(28px) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes fadeRise {
        from {
            opacity: 0;
            transform: translateY(12px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes accentFlow {
        from {
            background-position: 0 0;
        }

        to {
            background-position: 250% 0;
        }
    }

    @keyframes buttonGlow {
        0%, 100% {
            box-shadow: 0 8px 20px rgba(47, 107, 255, 0.18);
        }

        50% {
            box-shadow: 0 10px 26px rgba(47, 107, 255, 0.32);
        }
    }

    @keyframes driftBlue {
        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(30px, 22px);
        }
    }

    @keyframes driftBeige {
        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(-26px, -20px);
        }
    }

    @media (max-width: 575.98px) {
        .patient-login-page {
            min-height: auto;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            animation-delay: 0s !important;
            scroll-behavior: auto !important;
            transition-duration: 0.01ms !important;
        }

        .patient-login-card:hover,
        .patient-login-card .btn-primary:hover {
            transform: none;
        }
    }
</style>
{% endblock %}

{% block content %}
<!-- ===== Page loader (paste-anywhere block) ===== -->
<style>
  #msLoader {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    z-index: 2147483647;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #1E1E1C;
    opacity: 1; visibility: visible;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #msLoader.ms-hide { opacity: 0; visibility: hidden; }

  .ms-logo {
    position: relative; display: grid; place-items: center;
    width: 78px; height: 78px; border-radius: 22px;
    background: linear-gradient(135deg, #7EA3FF, #2F6BFF);
    box-shadow: 0 10px 30px rgba(47,107,255,.55);
    animation: ms-beat 1.4s ease-in-out infinite;
  }
  .ms-logo svg { width: 38px; height: 38px; fill: #fff; }
  .ms-logo::after {
    content: ""; position: absolute; inset: -12px;
    border: 2px solid rgba(126,163,255,.55); border-radius: 30px;
    animation: ms-ring 1.4s ease-out infinite;
  }
  .ms-title {
    color: #D8CBB3; font: 700 1.15rem "Segoe UI", -apple-system, Arial, sans-serif;
    letter-spacing: .3px;
  }
  .ms-ecg { width: 210px; height: 42px; }
  .ms-ecg path {
    fill: none; stroke: #2F6BFF; stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 340; stroke-dashoffset: 340;
    animation: ms-ecg 1.8s linear infinite;
  }

  @keyframes ms-beat {
    0%,100% { transform: scale(1); } 15% { transform: scale(1.12); }
    30% { transform: scale(1); }     45% { transform: scale(1.08); }
  }
  @keyframes ms-ring {
    0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; }
  }
  @keyframes ms-ecg {
    0% { stroke-dashoffset: 340; } 70%,100% { stroke-dashoffset: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ms-logo, .ms-logo::after, .ms-ecg path { animation-duration: 2.4s; }
  }
</style>

<noscript><style>#msLoader { display: none !important; }</style></noscript>

<div id="msLoader" aria-live="polite" aria-label="Loading">
  <div class="ms-logo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>
  <div class="ms-title">MediSlot</div>
  <svg class="ms-ecg" viewBox="0 0 220 44" aria-hidden="true">
    <path d="M0 22 H60 L72 6 L88 38 L100 22 H125 L135 14 L145 22 H220"/>
  </svg>
</div>
<script>
  /* move the loader to <body> so no wrapper in base.html can clip it or trap its z-index */
  document.body.appendChild(document.getElementById("msLoader"));
</script>

<script>
  (function () {
    var loader = document.getElementById("msLoader");
    if (!loader) return;
    var MIN_VISIBLE = 2500;                /* ms, change this to make the loader stay longer or shorter */
    var startedAt = Date.now() - performance.now();   /* counts from the start of navigation */
    var safetyTimer = null;

    function hide() {
      var wait = Math.max(0, MIN_VISIBLE - (Date.now() - startedAt));
      setTimeout(function () { loader.classList.add("ms-hide"); }, wait);
    }
    function show() {
      clearTimeout(safetyTimer);         /* a stale safety timeout must not hide the loader on navigation */
      startedAt = Date.now();
      loader.classList.remove("ms-hide");
    }

    // hide when the page finishes loading (safety timeout included)
    window.addEventListener("load", hide);
    safetyTimer = setTimeout(hide, 8000);

    // back/forward cache can restore the page with the loader stuck on
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) loader.classList.add("ms-hide");
    });

    // show it again when leaving for another page
    document.addEventListener("click", function (e) {
      var a = e.target.closest("a[href]");
      if (!a || e.defaultPrevented) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      if (a.target === "_blank" || a.hasAttribute("download")) return;
      var url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return;
      if (url.pathname === location.pathname && url.search === location.search) return;
      show();
    });
    document.addEventListener("submit", function (e) {
      if (!e.defaultPrevented) show();   // respects a cancelled confirm()
    });
  })();
</script>
<!-- ===== /Page loader ===== -->

<div class="patient-login-page row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="patient-login-card card shadow-sm border-0 p-4">

            <h2 class="mb-2">Patient sign in</h2>
            <p class="patient-login-description">
                Access your MediSlot patient account.
            </p>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control"
                           type="email"
                           name="email"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input class="form-control"
                           type="password"
                           name="password"
                           required>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Sign in
                </button>
            </form>

            <p class="mt-3 mb-0">
                New to MediSlot?
                <a href="{{ url_for('patient.register') }}">Create patient account</a>
            </p>

            <p class="mt-2">
                <a href="{{ url_for('auth.login') }}">Doctor login</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}
