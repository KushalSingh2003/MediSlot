<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot | Doctor Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --pink-primary: #F8B4C8;
            --pink-blush: #FCE4EC;
            --pink-rose: #D81B60;
            --pink-deep: #AD1457;
            --pink-bg: #FFF5F8;
            --pink-border: #F9D3DF;
            --pink-text: #4A2A36;
            --pink-muted: #9A7584;
        }

        /* ---------- Keyframes ---------- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(36px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-18px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes floatA {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(40px, 30px) scale(1.08); }
        }

        @keyframes floatB {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-45px, -35px) scale(1.1); }
        }

        @keyframes pulseRing {
            0%   { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0.35); }
            70%  { box-shadow: 0 0 0 16px rgba(216, 27, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0); }
        }

        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes growLine {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        /* ---------- Page ---------- */
        html {
            background: linear-gradient(160deg, #FFF5F8 0%, #FFFFFF 45%, #FCE4EC 100%) fixed;
        }

        body {
            background: transparent !important;
            color: var(--pink-text);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;
            top: -120px;
            left: -120px;
            background: rgba(248, 180, 200, 0.55);
            animation: floatA 14s ease-in-out infinite;
        }

        body::after {
            width: 460px;
            height: 460px;
            bottom: -160px;
            right: -140px;
            background: rgba(216, 27, 96, 0.22);
            animation: floatB 17s ease-in-out infinite;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        /* ---------- Card ---------- */
        .card {
            background: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(10px);
            border: 1px solid var(--pink-border) !important;
            border-radius: 24px !important;
            box-shadow: 0 20px 50px rgba(216, 27, 96, 0.14) !important;
            padding: 40px 44px !important;
            position: relative;
            overflow: hidden;
            animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #F8B4C8, #D81B60, #F8B4C8);
            background-size: 200% 100%;
            animation: shimmer 5s linear infinite;
        }

        /* ---------- Header ---------- */
        .card .text-center.mb-4 {
            margin-bottom: 32px !important;
            padding-bottom: 24px;
            border-bottom: 1px dashed var(--pink-border);
            animation: fadeUp 0.7s ease 0.15s both;
        }

        .card h2.text-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 2rem;
            background: linear-gradient(120deg, #AD1457, #D81B60 50%, #F06292);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent !important;
            margin-bottom: 4px;
            letter-spacing: 0.4px;
        }

        .card h2.text-primary::before {
            content: "\271A";
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #F8B4C8, #D81B60);
            -webkit-text-fill-color: #FFFFFF;
            color: #FFFFFF;
            font-size: 1.2rem;
            animation: pulseRing 2.4s infinite;
        }

        .card .text-muted {
            color: var(--pink-muted) !important;
            font-size: 0.95rem;
            margin-bottom: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ---------- Alerts ---------- */
        .alert {
            border-radius: 14px;
            border: 1px solid var(--pink-border);
            font-weight: 500;
            animation: slideIn 0.5s ease both;
        }

        .alert-success { background: #FCE4EC; color: #AD1457; border-color: #F8B4C8; }
        .alert-danger  { background: #FFEBEE; color: #C62828; border-color: #FFCDD2; }
        .alert-warning { background: #FFF3E0; color: #E65100; border-color: #FFE0B2; }
        .alert-info    { background: #F3E5F5; color: #7B1FA2; border-color: #E1BEE7; }

        /* ---------- Form staggered entrance ---------- */
        form > * {
            animation: fadeUp 0.6s ease both;
        }

        form > *:nth-child(1)  { animation-delay: 0.25s; }
        form > *:nth-child(2)  { animation-delay: 0.30s; }
        form > *:nth-child(3)  { animation-delay: 0.35s; }
        form > *:nth-child(4)  { animation-delay: 0.40s; }
        form > *:nth-child(5)  { animation-delay: 0.45s; }
        form > *:nth-child(6)  { animation-delay: 0.50s; }
        form > *:nth-child(7)  { animation-delay: 0.55s; }
        form > *:nth-child(8)  { animation-delay: 0.60s; }
        form > *:nth-child(9)  { animation-delay: 0.65s; }
        form > *:nth-child(10) { animation-delay: 0.70s; }
        form > *:nth-child(11) { animation-delay: 0.75s; }
        form > *:nth-child(12) { animation-delay: 0.80s; }
        form > *:nth-child(13) { animation-delay: 0.85s; }
        form > *:nth-child(14) { animation-delay: 0.90s; }
        form > *:nth-child(15) { animation-delay: 0.95s; }
        form > *:nth-child(16) { animation-delay: 1.00s; }
        form > *:nth-child(17) { animation-delay: 1.05s; }
        form > *:nth-child(18) { animation-delay: 1.10s; }
        form > *:nth-child(19) { animation-delay: 1.15s; }

        /* ---------- Section headings & dividers ---------- */
        form h5 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--pink-deep);
            margin-bottom: 20px !important;
        }

        form h5::before {
            content: "";
            width: 6px;
            height: 24px;
            border-radius: 6px;
            background: linear-gradient(180deg, #F8B4C8, #D81B60);
            flex-shrink: 0;
        }

        form hr {
            border: none;
            height: 1px;
            opacity: 1;
            margin: 30px 0;
            background: linear-gradient(90deg, rgba(248, 180, 200, 0), #F8B4C8, rgba(248, 180, 200, 0));
            transform-origin: center;
        }

        /* ---------- Fields ---------- */
        .form-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--pink-deep);
            margin-bottom: 8px;
        }

        .form-control {
            border: 1.5px solid var(--pink-border);
            border-radius: 12px;
            padding: 12px 16px;
            background: #FFFFFF;
            color: var(--pink-text);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease, background 0.25s ease;
        }

        .form-control:hover {
            border-color: var(--pink-primary);
            background: var(--pink-bg);
        }

        .form-control:focus {
            border-color: var(--pink-rose);
            background: #FFFFFF;
            box-shadow: 0 0 0 0.25rem rgba(248, 180, 200, 0.45);
            transform: translateY(-2px);
            outline: none;
        }

        .form-control::placeholder {
            color: #D7B3C1;
        }

        /* ---------- Qualification rows (also applies to dynamically added rows) ---------- */
        #qualifications {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 14px;
        }

        .qualification-row {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 130px 48px;
            gap: 12px;
            align-items: center;
            margin: 0 !important;
            padding: 14px;
            background: var(--pink-bg);
            border: 1px solid var(--pink-border);
            border-radius: 16px;
            animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .qualification-row:hover {
            border-color: var(--pink-primary);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.1);
        }

        .qualification-row > [class*="col-"] {
            width: 100% !important;
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        /* ---------- Buttons ---------- */
        .btn {
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(120deg, #F48FB1 0%, #D81B60 50%, #F48FB1 100%) !important;
            background-size: 200% 100% !important;
            border: none !important;
            color: #FFFFFF !important;
            padding: 14px 24px;
            font-size: 1.02rem;
            letter-spacing: 0.4px;
            box-shadow: 0 10px 24px rgba(216, 27, 96, 0.3);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-position: 100% 0 !important;
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(216, 27, 96, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.99);
        }

        .btn-outline-primary {
            color: var(--pink-rose) !important;
            background: #FFFFFF !important;
            border: 1.5px solid var(--pink-primary) !important;
            border-radius: 999px;
            padding: 8px 20px;
        }

        .btn-outline-primary:hover {
            background: linear-gradient(135deg, #F48FB1, #D81B60) !important;
            color: #FFFFFF !important;
            border-color: transparent !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(216, 27, 96, 0.28);
        }

        .btn-outline-danger {
            width: 48px;
            height: 48px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1;
            color: #C2185B !important;
            background: #FFFFFF !important;
            border: 1.5px solid var(--pink-border) !important;
            border-radius: 12px;
        }

        .btn-outline-danger:hover {
            background: #FFEBEE !important;
            border-color: #EF9A9A !important;
            color: #C62828 !important;
            transform: rotate(90deg) scale(1.05);
        }

        /* ---------- Footer link ---------- */
        .card > p.text-center {
            color: var(--pink-muted);
            padding-top: 20px;
            border-top: 1px dashed var(--pink-border);
            margin-bottom: 0;
            animation: fadeUp 0.6s ease 1.25s both;
        }

        .card a {
            color: var(--pink-rose);
            font-weight: 700;
            text-decoration: none;
            background-image: linear-gradient(var(--pink-rose), var(--pink-rose));
            background-size: 0 2px;
            background-position: 0 100%;
            background-repeat: no-repeat;
            transition: background-size 0.3s ease, color 0.2s ease;
        }

        .card a:hover {
            background-size: 100% 2px;
            color: var(--pink-deep);
        }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--pink-primary); border-radius: 8px; }
        ::-webkit-scrollbar-track { background: var(--pink-bg); }

        /* ---------- Responsive ---------- */
        @media (max-width: 767.98px) {
            .card {
                padding: 28px 20px !important;
                border-radius: 20px !important;
            }

            .container {
                padding-left: 14px;
                padding-right: 14px;
            }

            .qualification-row {
                grid-template-columns: minmax(0, 1fr) 48px;
            }

            .qualification-row > [class*="col-"]:nth-child(1),
            .qualification-row > [class*="col-"]:nth-child(2) {
                grid-column: 1 / -1 !important;
            }

            .qualification-row > [class*="col-"]:nth-child(3) {
                grid-column: 1 / 2 !important;
            }

            .qualification-row > [class*="col-"]:nth-child(4) {
                grid-column: 2 / 3 !important;
            }
        }

        @media (max-width: 575.98px) {
            .card h2.text-primary {
                font-size: 1.6rem;
            }
        }

        /* ---------- Accessibility: reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="bg-light" style="background: transparent; color: #4A2A36; margin: 0;">

<div class="container py-5">
    <div class="card shadow border-0 mx-auto p-4" style="max-width: 850px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">MediSlot</h2>
            <p class="text-muted">Doctor Registration</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">

            <h5 class="mb-3">Personal Information</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name *</label>
                    <input name="firstName" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name *</label>
                    <input name="lastName" class="form-control" required>
                </div>
                

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control"
                           minlength="8" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone *</label>
                    <input name="phone" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Years of Experience *</label>
                    <input type="number" name="yearsExperience"
                           class="form-control" min="0" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Specialisation *</label>
                    <input name="specialisation" class="form-control" required>
                </div>
            </div>

            <hr>

            <h5 class="mb-3">Medical Licence</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Licence Number *</label>
                    <input
    type="text"
    name="licenceNumber"
    class="form-control"
    minlength="3"
    maxlength="30"
    pattern="[A-Za-z0-9/ -]{3,30}"
    title="Enter 3-30 letters, numbers, spaces, / or -."
    required
>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Licence Authority *</label>
                    <input name="licenceAuthority" class="form-control" required>
                </div>
            </div>

            <hr>

            <h5 class="mb-3">Qualifications</h5>

            <div id="qualifications">
                <div class="row qualification-row mb-3">
                    <div class="col-md-4">
                        <input name="degree[]" class="form-control"
                               placeholder="Degree">
                    </div>
                    <div class="col-md-4">
                        <input name="institution[]" class="form-control"
                               placeholder="Institution">
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="year[]" class="form-control"
                               placeholder="Year">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger"
                                onclick="this.closest('.qualification-row').remove()">
                            ×
                        </button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-outline-primary btn-sm mb-3"
                    onclick="addQualification()">
                + Add Qualification
            </button>

            <hr>

            <h5 class="mb-3">Address</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <input name="addressLine1" class="form-control"
                           placeholder="Address Line 1">
                </div>

                <div class="col-md-6 mb-3">
                    <input name="addressLine2" class="form-control"
                           placeholder="Address Line 2">
                </div>

                <div class="col-md-6 mb-3">
                    <input name="city" class="form-control" placeholder="City">
                </div>

                <div class="col-md-6 mb-3">
                    <input name="postalCode" class="form-control"
                           placeholder="Postal Code">
                </div>
            </div>

            <hr>

            <h5 class="mb-3">Languages</h5>

            <div class="mb-3">
                <input name="languagesSpoken" class="form-control"
                       placeholder="English, Hindi, Telugu">
            </div>

            <hr>

            <h5 class="mb-3">Hospital Information</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <input name="hospitalName" class="form-control"
                           placeholder="Hospital Name">
                </div>

                <div class="col-md-6 mb-3">
                    <input name="department" class="form-control"
                           placeholder="Department">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">
                Register as Doctor
            </button>

        </form>

        <p class="text-center mt-3">
            Already registered?
            <a href="{{ url_for('auth.login') }}">Login</a>
        </p>

    </div>
</div>

<script>
function addQualification() {
    const container = document.getElementById("qualifications");

    const row = document.createElement("div");
    row.className = "row qualification-row mb-3";

    row.innerHTML = `
        <div class="col-md-4">
            <input name="degree[]" class="form-control" placeholder="Degree">
        </div>
        <div class="col-md-4">
            <input name="institution[]" class="form-control"
                   placeholder="Institution">
        </div>
        <div class="col-md-3">
            <input type="number" name="year[]" class="form-control"
                   placeholder="Year">
        </div>
        <div class="col-md-1">
            <button type="button" class="btn btn-outline-danger"
                    onclick="this.closest('.qualification-row').remove()">
                ×
            </button>
        </div>
    `;

    container.appendChild(row);
}
</script>

</body>
</html>
