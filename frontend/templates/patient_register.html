{% extends "base.html" %}
{% block title %}Patient Registration | MediSlot{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-7"><div class="card shadow-sm border-0 p-4">
<h2>Create patient account</h2><p class="text-muted">Enter your details to get started.</p>
<form method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">First name</label><input class="form-control" name="firstName" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Last name</label><input class="form-control" name="lastName" required></div></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="10" required><div class="form-text">At least 10 characters, including a letter and a digit.</div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6 mb-3"><label class="form-label">City</label><input class="form-control" name="city"></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="dateOfBirth"></div><div class="col-md-6 mb-3"><label class="form-label">Gender</label><input class="form-control" name="gender"></div></div>
<button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('patient.login') }}">Sign in</a></p>
</div></div></div>
{% endblock %}
