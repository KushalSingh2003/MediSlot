AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot API Gateway and Lambda integrations also

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod

  ProjectName:
    Type: String
    Default: medislot

Resources:

  # --------------------------------------------------
  # REST API
  # --------------------------------------------------

  MediSlotApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Env}-api'
      Description: MediSlot authentication API
      EndpointConfiguration:
        Types:
        - REGIONAL

  # --------------------------------------------------
  # API RESOURCES
  # --------------------------------------------------

  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !GetAtt MediSlotApi.RootResourceId
      PathPart: auth

  PatientsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: patients

  DoctorsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: doctors

  PatientRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref PatientsResource
      PathPart: register

  PatientLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref PatientsResource
      PathPart: login

  DoctorRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorsResource
      PathPart: register

  DoctorLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorsResource
      PathPart: login

  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: refresh

  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref AuthResource
      PathPart: logout

  DoctorsRootResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !GetAtt MediSlotApi.RootResourceId
      PathPart: doctors

  PatientsRootResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !GetAtt MediSlotApi.RootResourceId
      PathPart: patients

  DoctorMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorsRootResource
      PathPart: me

  PatientMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref PatientsRootResource
      PathPart: me
  # --------------------------------------------------
  # LAMBDA PERMISSIONS
  # --------------------------------------------------

  RegisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-AuthRegisterFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  LoginLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-AuthLoginFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  RefreshLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-AuthRefreshFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  LogoutLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-AuthLogoutFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi
  GetDoctorProfileLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-DoctorProfileFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  GetPatientProfileLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-PatientProfileFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  # --------------------------------------------------
  # API METHODS
  # --------------------------------------------------

  PatientRegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref PatientRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AuthRegisterFunctionArn'

  PatientLoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref PatientLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AuthLoginFunctionArn'

  DoctorRegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AuthRegisterFunctionArn'

  DoctorLoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AuthLoginFunctionArn'

  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AuthRefreshFunctionArn'

  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AuthLogoutFunctionArn'
  GetDoctorProfileMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorProfileFunctionArn'
  PutDoctorProfileMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorMeResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorProfileFunctionArn'

  GetPatientProfileMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref PatientMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-PatientProfileFunctionArn'
  LambdaAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-${Env}-authorizer'
      RestApiId: !Ref MediSlotApi
      Type: REQUEST
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
        - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
        - LambdaArn:
            Fn::ImportValue:
              Fn::Sub: '${ProjectName}-${Env}-application-AuthAuthorizerFunctionArn'
  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-AuthAuthorizerFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/authorizers/${AuthorizerId}'
        - ApiId: !Ref MediSlotApi
          AuthorizerId: !Ref LambdaAuthorizer
  DoctorPhotoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: photo

  DoctorConsultationTypesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: consultation-types

  DoctorConsultationTypeIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorConsultationTypesResource
      PathPart: '{typeId}'

  DoctorAvailabilityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: availability

  DoctorBlackoutsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: blackouts

  DoctorBlackoutIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorBlackoutsResource
      PathPart: '{blackoutId}'

  DoctorScheduleResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: schedule

  DoctorAppointmentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: appointments

  DoctorAppointmentIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorAppointmentsResource
      PathPart: '{id}'

  DoctorAppointmentOutcomeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorAppointmentIdResource
      PathPart: outcome

  DoctorSlotsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorMeResource
      PathPart: slots

  DoctorSlotIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MediSlotApi
      ParentId: !Ref DoctorSlotsResource
      PathPart: '{slotId}'

  # --------------------------------------------------
  # LAMBDA PERMISSIONS
  # --------------------------------------------------

  DoctorPhotoLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-DoctorPhotoFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  DoctorConsultationTypesLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-DoctorConsultationTypesFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  DoctorBlackoutsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-DoctorBlackoutsFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  DoctorScheduleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: '${ProjectName}-${Env}-application-DoctorScheduleFunctionArn'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*'
        - ApiId: !Ref MediSlotApi

  DoctorAppointmentsLambdaPermission:
