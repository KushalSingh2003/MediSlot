      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorBlackoutsFunctionArn'

  DoctorBlackoutsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorBlackoutsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorBlackoutsFunctionArn'

  DoctorBlackoutsDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorBlackoutIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorBlackoutsFunctionArn'

  DoctorScheduleGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorScheduleResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      RequestParameters:
        method.request.querystring.date: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorScheduleFunctionArn'

  DoctorAppointmentsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorAppointmentsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      RequestParameters:
        method.request.querystring.from: false
        method.request.querystring.to: false
        method.request.querystring.status: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorAppointmentsFunctionArn'

  DoctorSlotCancellationDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorSlotIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-DoctorSlotCancellationFunctionArn'

  AppointmentOutcomePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MediSlotApi
      ResourceId: !Ref DoctorAppointmentOutcomeResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn:
              Fn::ImportValue:
                Fn::Sub: '${ProjectName}-${Env}-application-AppointmentOutcomeFunctionArn'

  # --------------------------------------------------
  # API DEPLOYMENT
  # --------------------------------------------------

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - PatientRegisterMethod
    - PatientLoginMethod
    - DoctorRegisterMethod
    - DoctorLoginMethod
    - RefreshMethod
    - LogoutMethod
    - GetDoctorProfileMethod
    - PutDoctorProfileMethod
    - GetPatientProfileMethod
    - DoctorPhotoMethod
    - DoctorConsultationTypesPostMethod
    - DoctorConsultationTypesGetMethod
    - DoctorConsultationTypesPutMethod
    - DoctorConsultationTypesDeleteMethod
    - DoctorAvailabilityPutMethod
    - DoctorBlackoutsPostMethod
    - DoctorBlackoutsGetMethod
    - DoctorBlackoutsDeleteMethod
    - DoctorScheduleGetMethod
    - DoctorAppointmentsGetMethod
    - DoctorSlotCancellationDeleteMethod
    - AppointmentOutcomePostMethod
    Properties:
      RestApiId: !Ref MediSlotApi
      Description: !Sub 'MediSlot ${Env} API deployment'

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MediSlotApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Env
      Description: !Sub 'MediSlot ${Env} stage'

Outputs:
  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref MediSlotApi
    Export:
      Name: !Sub '${ProjectName}-${Env}-api-ApiId'

  ApiBaseUrl:
    Description: Base URL for the deployed API
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}'

  PatientRegisterUrl:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}/auth/patients/register'

  PatientLoginUrl:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}/auth/patients/login'

  DoctorRegisterUrl:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}/auth/doctors/register'

  DoctorLoginUrl:
    Value: !Sub 'https://${MediSlotApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}/auth/doctors/login'
