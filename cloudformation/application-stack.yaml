      RetentionInDays: !Ref LogRetentionDays

  AppointmentOutcomeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-appointment-outcome'
      Description: Mark an appointment completed or no-show
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AppointmentOutcomeRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
