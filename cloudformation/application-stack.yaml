AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot application stack - auth Lambdas (register, login, refresh, logout) authentication system along with the API Gateway and authorizer

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [ dev, prod ]
  ProjectName:
    Type: String
    Default: medislot
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the packaged code (from the pipeline)
  ArtifactPrefix:
    Type: String
    Description: Key prefix for this build, for example medislot/<git-sha>
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [ 1, 3, 5, 7, 14, 30, 60, 90 ]

Resources:
  # ==========================================================================
  # Shared dependency layer: bcrypt, PyJWT, PyMySQL
  # ==========================================================================
  AuthDependenciesLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      Description: bcrypt, PyJWT and PyMySQL built for Lambda
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-layer.zip'
      CompatibleRuntimes: [ python3.12 ]
      CompatibleArchitectures: [ x86_64 ]

  # ==========================================================================
  # Log groups (created here so retention is managed, and the roles only
  # need CreateLogStream and PutLogEvents)
  # ==========================================================================
  RegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-register'
      RetentionInDays: !Ref LogRetentionDays

  LoginLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-login'
      RetentionInDays: !Ref LogRetentionDays
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-authorizer'
      RetentionInDays: !Ref LogRetentionDays

  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-refresh'
      RetentionInDays: !Ref LogRetentionDays

  LogoutLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-logout'
      RetentionInDays: !Ref LogRetentionDays
  GetDoctorProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-get-doctor-profile'
      RetentionInDays: !Ref LogRetentionDays

  GetPatientProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-get-patient-profile'
      RetentionInDays: !Ref LogRetentionDays
  DbMigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-db-migration'
      RetentionInDays: !Ref LogRetentionDays

  # ==========================================================================
  # Register Lambda (VPC: reaches RDS)
  # ==========================================================================
  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-register'
      Description: Register a doctor or patient (role comes from the route)
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthRegisterRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-register.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 512 # bcrypt is CPU-bound; more memory also means more CPU
      Timeout: 15
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RegisterLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
      ReservedConcurrentExecutions: 10

  # ==========================================================================
  # Login Lambda (VPC: reaches RDS)
  # ==========================================================================
  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-login'
      Description: Verify credentials and issue an access JWT and a refresh token
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthLoginRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-login.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 512
      Timeout: 15
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LoginLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-RefreshTokensTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
      ReservedConcurrentExecutions: 20

  # ==========================================================================
  # Refresh Lambda (no VPC)
  # ==========================================================================
  RefreshFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-refresh'
      Description: Rotate the refresh token and issue a new access JWT
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthRefreshRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-refresh.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 10
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RefreshLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-RefreshTokensTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
      ReservedConcurrentExecutions: 20

  # ==========================================================================
  # Logout Lambda (no VPC)
  # ==========================================================================
  LogoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-logout'
      Description: Delete the refresh token and denylist the access token jti
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthLogoutRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-logout.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 10
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LogoutLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-RefreshTokensTableName'
          TOKEN_DENYLIST_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-TokenDenylistTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
        ReservedConcurrentExecutions: 10

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-authorizer'
      Description: Verify the JWT, check the denylist, return a role-scoped policy
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthorizerRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/authorizer.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 5
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AuthorizerLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          TOKEN_DENYLIST_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-TokenDenylistTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
  #========================================================================
  # Get Doctor Profile Lambda (in VPC: RDS). Reads the doctor profile from the database.
  #========================================================================
  GetDoctorProfileFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W92
          reason: Reserved concurrency is deliberately not set
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-get-doctor-profile'
      Description: Retrieve the authenticated doctor's profile
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler

      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-GetDoctorProfileRoleArn'

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/get-doctor-profile.zip'

      Layers:
      - !Ref AuthDependenciesLayer

      MemorySize: 256
      Timeout: 10
      TracingConfig:
        Mode: Active

      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetDoctorProfileLogGroup

      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'

      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
  #========================================================================
  # Get Patient Profile Lambda (in VPC: RDS). Reads the patient profile from the database.
  #========================================================================
  GetPatientProfileFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W92
          reason: Reserved concurrency is deliberately not set
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-get-patient-profile'
      Description: Retrieve the authenticated patient's profile
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler

      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-GetPatientProfileRoleArn'

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/get-patient-profile.zip'

      Layers:
      - !Ref AuthDependenciesLayer

      MemorySize: 256
      Timeout: 10
      TracingConfig:
        Mode: Active

      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetPatientProfileLogGroup

      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'

      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
  DbMigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-db-migration'
      Description: Initialize the MediSlot RDS MySQL database schema
      Runtime: python3.12
      Architectures:
      - x86_64
      Handler: app.lambda_handler

      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DbMigrationRoleArn'

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/db-migration.zip'

      Layers:
      - !Ref AuthDependenciesLayer

      MemorySize: 256
      Timeout: 60

      TracingConfig:
        Mode: Active

      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DbMigrationLogGroup

      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'

      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

Outputs:
  RegisterFunctionArn:
    Value: !GetAtt RegisterFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthRegisterFunctionArn' }
  LoginFunctionArn:
    Value: !GetAtt LoginFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthLoginFunctionArn' }
  RefreshFunctionArn:
    Value: !GetAtt RefreshFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthRefreshFunctionArn' }
  LogoutFunctionArn:
    Value: !GetAtt LogoutFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthLogoutFunctionArn' }
  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthAuthorizerFunctionArn' }
  DoctorProfileFunctionArn:
    Value: !GetAtt GetDoctorProfileFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorProfileFunctionArn'

  PatientProfileFunctionArn:
    Value: !GetAtt GetPatientProfileFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PatientProfileFunctionArn'
  DbMigrationFunctionArn:
    Value: !GetAtt DbMigrationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DbMigrationFunctionArn'
