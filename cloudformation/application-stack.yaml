AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot application stack - auth Lambdas (register, login, refresh, logout) authentication system along with the API Gateway and authorizer more and more

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [ dev, prod ]
  ProjectName:
    Type: String
    Default: medislot
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the packaged code (from the pipeline)
  ArtifactPrefix:
    Type: String
    Description: Key prefix for this build, for example medislot/<git-sha>
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [ 1, 3, 5, 7, 14, 30, 60, 90 ]
  ApiBaseUrl:
    Type: String
    Default: "https://placeholder.execute-api.ap-south-1.amazonaws.com/dev"
    Description: Temporary API Gateway URL, to be updated after API deployment

Resources:
  # ==========================================================================
  # Shared dependency layer: bcrypt, PyJWT, PyMySQL
  # ==========================================================================
  AuthDependenciesLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      Description: bcrypt, PyJWT and PyMySQL built for Lambda
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-layer.zip'
      CompatibleRuntimes: [ python3.12 ]
      CompatibleArchitectures: [ x86_64 ]

  # ==========================================================================
  # Log groups (created here so retention is managed, and the roles only
  # need CreateLogStream and PutLogEvents)
  # ==========================================================================
  RegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-register'
      RetentionInDays: !Ref LogRetentionDays
  DoctorPhotoLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-photo'
      RetentionInDays: !Ref LogRetentionDays

  LoginLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-login'
      RetentionInDays: !Ref LogRetentionDays
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-authorizer'
      RetentionInDays: !Ref LogRetentionDays

  RefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-refresh'
      RetentionInDays: !Ref LogRetentionDays

  LogoutLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - { id: W84, reason: Customer-managed KMS keys are not permitted in this project }
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-auth-logout'
      RetentionInDays: !Ref LogRetentionDays
  GetDoctorProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-get-doctor-profile'
      RetentionInDays: !Ref LogRetentionDays

  GetPatientProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-get-patient-profile'
      RetentionInDays: !Ref LogRetentionDays
  DoctorDiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-discovery'
      RetentionInDays: !Ref LogRetentionDays

  DbMigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-db-migration'
      RetentionInDays: !Ref LogRetentionDays

  # ==========================================================================
  # Register Lambda (VPC: reaches RDS)
  # ==========================================================================
  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-register'
      Description: Register a doctor or patient (role comes from the route)
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthRegisterRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-register.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 512 # bcrypt is CPU-bound; more memory also means more CPU
      Timeout: 15
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RegisterLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  # ==========================================================================
  # Login Lambda (VPC: reaches RDS)
  # ==========================================================================
  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-login'
      Description: Verify credentials and issue an access JWT and a refresh token
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthLoginRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-login.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 512
      Timeout: 15
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LoginLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-RefreshTokensTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  # ==========================================================================
  # Refresh Lambda (no VPC)
  # ==========================================================================
  RefreshFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-refresh'
      Description: Rotate the refresh token and issue a new access JWT
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthRefreshRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-refresh.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 10
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RefreshLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-RefreshTokensTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  # ==========================================================================
  # Logout Lambda (no VPC)
  # ==========================================================================
  LogoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-auth-logout'
      Description: Delete the refresh token and denylist the access token jti
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthLogoutRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/auth-logout.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 10
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LogoutLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          REFRESH_TOKENS_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-RefreshTokensTableName'
          TOKEN_DENYLIST_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-TokenDenylistTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-authorizer'
      Description: Verify the JWT, check the denylist, return a role-scoped policy
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AuthorizerRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/authorizer.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 5
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AuthorizerLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          TOKEN_DENYLIST_TABLE:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-TokenDenylistTableName'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  #========================================================================
  # Get Doctor Profile Lambda (in VPC: RDS). Reads the doctor profile from the database.
  #========================================================================
  GetDoctorProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-get-doctor-profile'
      Description: Retrieve the authenticated doctor's profile
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler

      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorProfileRoleArn'

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/get-doctor-profile.zip'

      Layers:
      - !Ref AuthDependenciesLayer

      MemorySize: 256
      Timeout: 10
      TracingConfig:
        Mode: Active

      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetDoctorProfileLogGroup

      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          PHOTOS_BUCKET:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-PhotosBucketName'

      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  #========================================================================
  # Get Patient Profile Lambda (in VPC: RDS). Reads the patient profile from the database.
  #========================================================================
  GetPatientProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-get-patient-profile'
      Description: Create, retrieve, update and delete the authenticated patient's profile
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler

      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-GetPatientProfileRoleArn'

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/get-patient-profile.zip'

      Layers:
      - !Ref AuthDependenciesLayer

      MemorySize: 256
      Timeout: 10
      TracingConfig:
        Mode: Active

      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetPatientProfileLogGroup

      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'

      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  DoctorDiscoveryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-discovery'
      Description: Public doctor search, public profile and slot availability lookup
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorDiscoveryRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-discovery.zip'
      Layers: [ !Ref AuthDependenciesLayer ]
      MemorySize: 256
      Timeout: 10
      TracingConfig: { Mode: Active }
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorDiscoveryLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  DbMigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-db-migration'
      Description: Initialize the MediSlot RDS MySQL database schema
      Runtime: python3.12
      Architectures:
      - x86_64
      Handler: app.lambda_handler

      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DbMigrationRoleArn'

      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/db-migration.zip'

      Layers:
      - !Ref AuthDependenciesLayer

      MemorySize: 256
      Timeout: 60

      TracingConfig:
        Mode: Active

      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DbMigrationLogGroup

      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'

      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
  DoctorPhotoFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-photo'
      Description: Create a presigned S3 upload URL for doctor profile photos
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorPhotoRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-photo.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorPhotoLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
          PHOTOS_BUCKET:
            Fn::ImportValue: !Sub '${ProjectName}-${Env}-data-PhotosBucketName'

  DoctorConsultationTypesLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-consultation-types'
      RetentionInDays: !Ref LogRetentionDays

  DoctorConsultationTypesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-consultation-types'
      Description: Manage the authenticated doctor's consultation types
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorConsultationTypesRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-consultation-types.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorConsultationTypesLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  DoctorBlackoutsLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-blackouts'
      RetentionInDays: !Ref LogRetentionDays

  DoctorBlackoutsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-blackouts'
      Description: Manage doctor blackout dates
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorBlackoutsRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-blackouts.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorBlackoutsLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  DoctorScheduleLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-schedule'
      RetentionInDays: !Ref LogRetentionDays

  DoctorScheduleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-schedule'
      Description: Retrieve a doctor's daily schedule and booked patients
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorScheduleRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-schedule.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorScheduleLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  DoctorAppointmentsLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-appointments'
      RetentionInDays: !Ref LogRetentionDays

  DoctorAppointmentsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-appointments'
      Description: List the authenticated doctor's appointments
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorAppointmentsRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-appointments.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorAppointmentsLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  DoctorSlotCancellationLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-doctor-slot-cancellation'
      RetentionInDays: !Ref LogRetentionDays

  DoctorSlotCancellationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-doctor-slot-cancellation'
      Description: Cancel a doctor slot and process related appointment updates
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-DoctorSlotCancellationRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor-slot-cancellation.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DoctorSlotCancellationLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  AppointmentOutcomeLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-appointment-outcome'
      RetentionInDays: !Ref LogRetentionDays

  AppointmentOutcomeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-appointment-outcome'
      Description: Mark an appointment completed or no-show
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-AppointmentOutcomeRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/appointment-outcome.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AppointmentOutcomeLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  SlotTemplateAdminLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-slot-template-admin'
      RetentionInDays: !Ref LogRetentionDays

  SlotTemplateAdminFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-slot-template-admin'
      Description: Create or update the global slot template and consultation rules
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-SlotTemplateAdminRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/slot-template-admin.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref SlotTemplateAdminLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'

  SlotMaterializerLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W84
          reason: Customer-managed KMS keys are not permitted in this project.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-slot-materializer'
      RetentionInDays: !Ref LogRetentionDays

  SlotMaterializerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-slot-materializer'
      Description: Materialize slots from the global template for the rolling availability window
      Runtime: python3.12
      Architectures: [ x86_64 ]
      Handler: app.lambda_handler
      Role:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-iam-SlotMaterializerRoleArn'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/slot-materializer.zip'
      Layers:
      - !Ref AuthDependenciesLayer
      MemorySize: 256
      Timeout: 15
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref SlotMaterializerLogGroup
      Environment:
        Variables:
          ENV: !Ref Env
          SSM_PREFIX: !Sub '/${ProjectName}/${Env}'
      VpcConfig:
        SubnetIds: !Split
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PrivateSubnetIds'
        SecurityGroupIds:
        - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-LambdaSgId'
    # ============================================================
    # FRONTEND EC2 IAM ROLE
    # ============================================================

  FrontendEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Env}-frontend-ec2-role'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
      - PolicyName: FrontendS3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject

            Resource:
            - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactPrefix}/frontend.zip'
    # ============================================================
    # MEDISLOT FRONTEND EC2
    # ============================================================

  FrontendEC2:
    Type: AWS::EC2::Instance

    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'

      InstanceType: t3.micro

      IamInstanceProfile: !Ref FrontendInstanceProfile

      SubnetId:
        Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-PublicSubnetId'

      SecurityGroupIds:
      - Fn::ImportValue: !Sub '${ProjectName}-${Env}-network-WebSgId'
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 8
          VolumeType: gp3
          Encrypted: true
          DeleteOnTermination: true

      UserData:
        Fn::Base64:
          Fn::Sub:
          - |
            #!/bin/bash
            set -eux

            # Install required packages
            dnf update -y
            dnf install -y python3 python3-pip nginx unzip awscli-2

            # Start SSM agent
            systemctl enable amazon-ssm-agent
            systemctl start amazon-ssm-agent

            # Create application directory
            mkdir -p /opt/medislot-frontend
            cd /opt/medislot-frontend

            # Download frontend package from S3
            aws s3 cp \
              s3://${ArtifactBucket}/${ArtifactPrefix}/frontend.zip \
              /tmp/frontend.zip

            # Extract frontend
            unzip -o /tmp/frontend.zip -d /opt/medislot-frontend

            # Create Python virtual environment
            python3 -m venv venv

            # Install dependencies
            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
            venv/bin/pip install gunicorn

            # Create Flask session and instance directories
            mkdir -p flask_session instance

            # Generate a persistent Flask secret
            FLASK_SECRET=$(openssl rand -hex 32)

            # Store application configuration
            cat > /etc/medislot-frontend.env <<EOF
            API_BASE_URL=${ApiBaseUrl}
            FLASK_SECRET_KEY=$FLASK_SECRET
            FLASK_ENV=production
            EOF

            chmod 600 /etc/medislot-frontend.env

            # Configure Gunicorn systemd service
            cat > /etc/systemd/system/medislot-frontend.service <<'EOF'
            [Unit]
            Description=MediSlot Flask Frontend
            After=network.target

            [Service]
            User=root
            WorkingDirectory=/opt/medislot-frontend
            EnvironmentFile=/etc/medislot-frontend.env
            ExecStart=/opt/medislot-frontend/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 app:app
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            # Configure Nginx reverse proxy
            cat > /etc/nginx/conf.d/medislot.conf <<'EOF'
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            # Start services
            nginx -t
            systemctl enable nginx
            systemctl restart nginx

            systemctl daemon-reload
            systemctl enable medislot-frontend
            systemctl start medislot-frontend

          - ArtifactBucket: !Ref ArtifactBucket
            ArtifactPrefix: !Ref ArtifactPrefix
            ApiBaseUrl: !Ref ApiBaseUrl

      Tags:
      - Key: Name
        Value: !Sub '${ProjectName}-${Env}-frontend-ec2'

      - Key: Project
        Value: !Ref ProjectName

      - Key: Environment
        Value: !Ref Env

  # ============================================================
  # FRONTEND EC2 INSTANCE PROFILE
  # ============================================================

  FrontendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref FrontendEC2Role

Outputs:
  RegisterFunctionArn:
    Value: !GetAtt RegisterFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthRegisterFunctionArn' }
  LoginFunctionArn:
    Value: !GetAtt LoginFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthLoginFunctionArn' }
  RefreshFunctionArn:
    Value: !GetAtt RefreshFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthRefreshFunctionArn' }
  LogoutFunctionArn:
    Value: !GetAtt LogoutFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthLogoutFunctionArn' }
  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
    Export: { Name: !Sub '${AWS::StackName}-AuthAuthorizerFunctionArn' }
  DoctorProfileFunctionArn:
    Value: !GetAtt GetDoctorProfileFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorProfileFunctionArn'

  PatientProfileFunctionArn:
    Value: !GetAtt GetPatientProfileFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PatientProfileFunctionArn'
  DoctorDiscoveryFunctionArn:
    Value: !GetAtt DoctorDiscoveryFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorDiscoveryFunctionArn'
  DbMigrationFunctionArn:
    Value: !GetAtt DbMigrationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DbMigrationFunctionArn'

  DoctorPhotoFunctionArn:
    Value: !GetAtt DoctorPhotoFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorPhotoFunctionArn'

  DoctorConsultationTypesFunctionArn:
    Value: !GetAtt DoctorConsultationTypesFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorConsultationTypesFunctionArn'

  DoctorBlackoutsFunctionArn:
    Value: !GetAtt DoctorBlackoutsFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorBlackoutsFunctionArn'

  DoctorScheduleFunctionArn:
    Value: !GetAtt DoctorScheduleFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorScheduleFunctionArn'

  DoctorAppointmentsFunctionArn:
    Value: !GetAtt DoctorAppointmentsFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorAppointmentsFunctionArn'

  DoctorSlotCancellationFunctionArn:
    Value: !GetAtt DoctorSlotCancellationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DoctorSlotCancellationFunctionArn'

  AppointmentOutcomeFunctionArn:
    Value: !GetAtt AppointmentOutcomeFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AppointmentOutcomeFunctionArn'

  SlotTemplateAdminFunctionArn:
    Value: !GetAtt SlotTemplateAdminFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SlotTemplateAdminFunctionArn'

  SlotMaterializerFunctionArn:
    Value: !GetAtt SlotMaterializerFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SlotMaterializerFunctionArn'
  FrontendInstanceId:
    Description: MediSlot frontend EC2 instance ID
    Value: !Ref FrontendEC2
    Export:
      Name: !Sub '${AWS::StackName}-FrontendInstanceId'

  FrontendPublicIP:
    Description: MediSlot frontend public IP
    Value: !GetAtt FrontendEC2.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-FrontendPublicIP'

  FrontendPublicDNS:
    Description: MediSlot frontend public DNS
    Value: !GetAtt FrontendEC2.PublicDnsName
    Export:
      Name: !Sub '${AWS::StackName}-FrontendPublicDNS'

  FrontendURL:
    Description: MediSlot frontend URL
    Value: !Sub 'http://${FrontendEC2.PublicIp}'
